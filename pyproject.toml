[build-system]
# >= 77 for PEP 639 support (the SPDX `license` string + `license-files`
# below); older setuptools only understands the deprecated table/classifier
# form and errors on the expression.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vtsearch"
version = "0.1.0"
requires-python = ">=3.10"
description = "Media explorer for browsing and voting on audio, images, text, video, or documents"
# Apache-2.0 covers this repository's source only. Embedding-model weights are
# downloaded at runtime under their publishers' own terms (some noncommercial),
# and two dependencies are AGPL-3.0 (ultralytics, PyMuPDF). See NOTICE.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime dependencies. These mirror requirements/base.txt + the per-plugin
# requirements.txt files so deptry can verify that every imported package is
# declared. requirements/base.txt remains the install spec (pins,
# --extra-index-url, plugin .txt fan-out); pyproject.toml is the source of
# truth deptry reads from.
dependencies = [
    # Core framework
    "flask",
    "flask-smorest",
    "marshmallow",
    "pydantic>=2",
    "gunicorn",
    "werkzeug",
    "numpy",
    "requests",
    # requests' own transport layer, imported directly by
    # vtscore.security.url_validation to subclass the connection/pool classes
    # its SSRF-guarded session mounts (the peer-address recheck that closes the
    # DNS-rebinding window). The floor is also a CVE pin (CVE-2026-44431,
    # CVE-2026-44432).
    "urllib3>=2.7.0",
    "tqdm",
    "scikit-learn",
    # Imported directly by vtscore.embedding.loader for the startup
    # threadpool-controller warm-up (also a scikit-learn dependency).
    "threadpoolctl",
    "umap-learn",
    "transformers",
    # Imported directly by vtscore.media.embedder for the Hub metadata
    # preflight (also a transformers dependency).
    "huggingface_hub",
    "pandas",
    # Read HuggingFace-hosted parquet demo datasets (RICO-Screen2Words, RVL-CDIP)
    # whose screenshots/document-images are stored as an Image-feature column
    # inside parquet shards. Used by vtscore.datasets.downloader._hf_parquet to
    # stream rows and decode the embedded image bytes to loose files on disk.
    "pyarrow",
    "pyyaml",
    "matplotlib",
    "scipy",
    "torch>=2.0.0",
    # Plugin deps that are imported from the codebase
    "sentence-transformers",
    "dnspython>=2.0.0",
    "librosa",
    "soundfile",
    # Resampler behind ``vtscore.media.audio.decode``. It arrives with librosa
    # anyway (librosa's own default ``res_type="soxr_hq"`` backend), but we call
    # it directly now that audio decoding no longer routes through librosa.load.
    "soxr",
    "sentencepiece",
    "protobuf",
    "Pillow",
    # SigLIP-L image embedder: loads open_clip's ``ViT-SO400M-14-SigLIP-384``
    # checkpoint so its 1152-d vectors match galleries embedded by open_clip
    # itself. ``timm`` (vision backbones) and ``ftfy`` (text cleanup) are
    # runtime deps of open_clip we never import directly — declared so a plain
    # install covers SigLIP-L, ignored under deptry DEP002 (transitive-only).
    "open_clip_torch",
    "timm",
    "ftfy",
    "opencv-python-headless",
    "imageio-ffmpeg",
    # Portable detector export: build a standalone ONNX scorer from a trained
    # MLP (vtscore.detectors.portable_bundle). Pure-Python protobuf builder; no
    # torch.onnx dependency (the graph is hand-assembled via onnx.helper).
    "onnx",
    # Extract the Clotho audio demo, which ships as a single .7z archive on
    # Zenodo (vtscore.datasets.downloader.core._extract_7z). Imported lazily so
    # a missing install still surfaces an actionable error, but declared here so
    # a plain `install.sh` covers the Clotho demo out of the box.
    "py7zr",
    # The actually-used dependencies of `toponymy` (VTSBrowse signpost naming;
    # vtscore.projection.signpost_build). toponymy itself is installed
    # `--no-deps` by scripts/install.sh / ensure-test-deps.sh because its
    # transformers<5 pin would downgrade the app's transformers and is
    # empirically unnecessary for our usage — see docs/plans/vtsbrowse-toponymy.md
    # (decision 1) — so its real deps are declared here instead. apricot-select
    # ships a legacy setup.py that needs the stdlib-distutils shim to build;
    # the install scripts pre-install it before the main requirements pass.
    "fast_hdbscan",
    "vectorizers",
    "apricot-select",
    "tenacity",
    "jinja2",
]

[project.optional-dependencies]
# The AGPL-3.0-or-later runtime dependencies, split out so a deployment that
# cannot take copyleft code has a way to say no. THIS EXTRA IS PART OF THE
# DEFAULT INSTALL: every documented install path requests it
# (`requirements/base.txt` and `requirements/gpu.txt` are `-e .[dev,agpl]`,
# and both Dockerfiles install those files), so a normal install pulls these
# in exactly as it did when they were hard dependencies. Opting out means
# using the `*-no-agpl.txt` mirrors -- `VTSEARCH_NO_AGPL=1 bash
# scripts/install.sh` -- and forgoing the features listed below, which then
# fail with an actionable message from `vtscore.utils.optional_deps`.
# See NOTICE and the License section of README.md.
agpl = [
    # PDF page rendering + document text extraction: vtscore.datasets.pdf,
    # vtscore.converters.document2image / document2text.
    "PyMuPDF",
    # YOLO object detection: the image extractor (vtscore.media.image.extractor)
    # and the image clipper (vtscore.media.image.clipper).
    "ultralytics",
]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "pre-commit",
    "deptry",
    "codespell",
    "vulture",
    "pip-audit",
    # Used only by the portable-detector export test to load the emitted ONNX
    # graph and confirm it scores identically to the trained torch model
    # (imported via importorskip, so deptry sees it as declared-but-unused).
    "onnxruntime",
    # `pyright` is the Python wrapper around the Node-based pyright CLI.
    # The wrapper lazy-downloads the binary on first invocation; the
    # exact binary version is pinned via PYRIGHT_PYTHON_FORCE_VERSION
    # in `run-tests.sh`.
    "pyright",
]

[tool.setuptools.packages.find]
include = ["vtsearch*", "vtscore*"]

[tool.setuptools.package-data]
# Ship the fixed VLAD visual vocabulary (a code asset, like model weights) used
# by the structural (SIFT/VLAD) embedder.  Rebuilt via scripts/build_vlad_codebook.py.
"vtscore.media" = ["assets/*.npy"]
# Zero-shot tag vocabularies for the signpost text providers (AudioSet-527 /
# OpenImages-600 class names; see vtscore.projection.signpost_texts).
"vtscore.projection" = ["assets/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Default rules (E4, E7, E9, F) + flake8-bandit (S) security checks +
# McCabe (C901) cyclomatic complexity gate. Stays conservative on style
# rules (E501 line-length etc. remain off) while keeping the security
# and complexity backstops on.
select = ["E4", "E7", "E9", "F", "S", "C901"]
# E402: Module level import not at top of file.
# S101 (assert): used for type narrowing where pyright needs help; the
#   project never runs under `python -O`.
# S104 (bind 0.0.0.0): intentional for `python app.py --host 0.0.0.0`,
#   and tests_lib/core/test_ssrf_validation.py uses the literal as a fixture.
# S105 (hardcoded password): false-positive-prone on env-var name strings.
# S110/S112 (silent except): used as best-effort fallbacks for optional
#   imports, logging setup, and progress-tracker teardown.
# S311 (non-crypto random): used for dataset splitting and shuffling.
# S324 (md5/sha1): used as content fingerprints throughout the codebase,
#   never for cryptographic purposes.
ignore = ["E402", "S101", "S104", "S105", "S110", "S112", "S311", "S324"]

# Default McCabe threshold (10). Existing legacy hot-spots carry a
# per-function `# noqa: C901` so the rule applies cleanly to new code;
# refactoring a flagged function removes its marker.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests use /tmp paths, pickle round-trips, and xml fixtures freely.
# C901 is also exempt for tests + scripts: test fixtures and one-off
# analysis scripts are not production code and don't benefit from
# the complexity gate.
"tests/**" = ["S108", "S301", "S314", "C901"]
"tests_lib/**" = ["S108", "S301", "S314", "C901"]
"scripts/**" = ["C901"]
# safe_pickle_load is the centralized helper that calls pickle.load on
# whitelisted bytes; flagging it would defeat the purpose of the wrapper.
"vtscore/security/pickle.py" = ["S301"]
# Intentional `git` / `ffmpeg` invocations: arguments are
# project-controlled paths, no shell expansion.
"vtsearch/__init__.py" = ["S603", "S607"]
"scripts/gen-docs-inventories.py" = ["S603", "S607"]
"vtscore/converters/video2audio.py" = ["S603"]
"vtscore/media/audio/decode.py" = ["S603"]
"vtscore/media/video/decode.py" = ["S603"]
"vtsearch/routes/media/list.py" = ["S603"]
# Atom feed parsing for the arXiv text-dataset downloader.
"vtscore/datasets/downloader/text.py" = ["S314"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Ruff >= 0.16 format-checks fenced code blocks inside Markdown by default,
# which flags ~41 docs files whose snippets are display prose (aligned
# comments, elided bodies), not runnable modules. Keep the format gate
# scoped to real Python sources.
exclude = ["*.md"]

[tool.deptry]
# scripts/ and tests/ pull in dev-only deps; data/ and frontend/ aren't Python.
extend_exclude = [
    "scripts",
    "frontend",
    "data",
    "static",
    "model_cache",
]

# Sibling modules that slides/figs/src/*.py and .claude/hooks/*.py import off
# their own directory (they are scripts run by path, not an installed package,
# so deptry reads the imports as third-party). Everything else under slides/
# and .claude/ is still checked.
known_first_party = ["coco_fixture", "report_svg", "slide_figure", "hook_payload"]

# Module name → distribution name. Deptry needs these when the importable
# module differs from the PyPI package.
[tool.deptry.package_module_name_map]
"scikit-learn" = "sklearn"
"umap-learn" = "umap"
"opencv-python-headless" = "cv2"
"PyMuPDF" = "fitz"
"Pillow" = "PIL"
"pyyaml" = "yaml"
"dnspython" = "dns"
"imageio-ffmpeg" = "imageio_ffmpeg"
"flask-smorest" = "flask_smorest"
"sentence-transformers" = "sentence_transformers"
"open_clip_torch" = "open_clip"

[tool.deptry.per_rule_ignores]
# DEP001: imported but not declared. These are optional / opportunistic
# imports that the codebase guards with try/except or pyright ignores;
# users opt in by installing the extra package.
DEP001 = [
    "paddleocr",
    "rarfile",
    "whisper",
    "facenet_pytorch",
    "torchvision",
    "safetensors",
    "huggingface_hub",
    "cuml",
    # SuperPoint/LightGlue backend for the structural (SPLG) image embedder,
    # imported lazily inside ``vtscore.media.structural_splg`` methods and
    # opt-in only (users install ``lightglue`` to enable structural matching).
    "lightglue",
    # Installed `--no-deps` by the install scripts (its transformers<5 pin is
    # empirically unnecessary; see docs/plans/vtsbrowse-toponymy.md), so it
    # cannot be declared here — declaring it would put its pins back in the
    # resolver. Its real deps ARE declared (fast_hdbscan et al.); the smoke
    # test in tests_lib/projection guards the --no-deps bypass.
    "toponymy",
]
# DEP003: imported as a transitive of another declared dependency.
# ``safetensors`` and ``torchvision`` ship with ``transformers`` / ``torch``
# (so they are always present in our supported install paths) but we
# import them directly for embedder weight-loading progress and EUPE
# preprocessing transforms. Declaring them as first-party doesn't add
# anything: the install path already pins them through the parent.
# ``huggingface_hub`` ships with ``transformers`` and is imported directly by
# the ParaSpeechCLAP embedder (``hf_hub_download`` for its checkpoint file).
# ``cuml`` is the optional GPU backend imported by ``vtscore.gpu_backends``
# (guarded by try/except; see its DEP001 ignore for the CPU-only dev box where
# it isn't installed at all). On a GRID RAPIDS venv cuml *is* installed — pulled
# in transitively by the RAPIDS stack rather than declared here — so deptry
# reclassifies the same import from DEP001 (missing) to DEP003 (transitive).
# Ignoring both rules keeps the gate green in either environment; declaring cuml
# as a first-party dep is wrong (it's GPU-only, best-effort, and installed off a
# separate CUDA-pinned index — see ``scripts/install.sh``).
DEP003 = [
    "safetensors",
    "torchvision",
    "huggingface_hub",
    "cuml",
    # Same dual classification as cuml: on a box where toponymy IS installed
    # (via the scripts' --no-deps step) deptry reclassifies the import from
    # DEP001 (missing) to DEP003 (transitive/undeclared). See the DEP001 note.
    "toponymy",
    # facenet-pytorch (FaceNet embedder + MTCNN face detector) is installed
    # --no-deps by the install scripts because its torch<2.3 / numpy<2 pins
    # would downgrade the app's stack. Once installed, deptry reclassifies the
    # import from DEP001 (missing) to DEP003 (present/undeclared), so it needs
    # ignoring under both rules. See the DEP001 note.
    "facenet_pytorch",
    # Same dual classification again: on a venv where lightglue IS installed
    # (pulled in transitively, e.g. alongside the GRID GPU stack) deptry
    # reclassifies the guarded structural-SPLG import from DEP001 to DEP003.
    "lightglue",
]
# DEP002: declared but not imported. Tools we run via their CLIs
# (pytest, ruff, …), runtime helpers loaded by name (gunicorn), or
# tokenizer dependencies pulled in transitively by transformers
# (sentencepiece, protobuf) that are needed at runtime even though
# our code never imports them directly.
DEP002 = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "pre-commit",
    "deptry",
    "codespell",
    "vulture",
    "pip-audit",
    "pyright",
    "gunicorn",
    "sentencepiece",
    "protobuf",
    # Runtime deps of ``open_clip_torch`` (the SigLIP-L embedder's loader):
    # ``timm`` supplies vision backbones and ``ftfy`` cleans up text. open_clip
    # imports them; our code never does, so they are declared-but-not-imported.
    "timm",
    "ftfy",
    # Loaded via importorskip in the portable-export test; never imported
    # statically, so deptry can't see the use.
    "onnxruntime",
    # toponymy's real dependencies, declared on its behalf because it is
    # installed --no-deps (see the DEP001 note on "toponymy"); our code never
    # imports them directly.
    "fast_hdbscan",
    "vectorizers",
    "apricot-select",
    "tenacity",
    "jinja2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_lib"]
# No ``pythonpath`` entry on purpose.  Putting ``tests`` and ``tests_lib`` on
# sys.path made a bare ``from helpers import ...`` ambiguous: pytest inserts
# the entries in reverse order, so ``tests/`` shadowed ``tests_lib/`` and every
# test in BOTH trees silently got tests/helpers.py (tests_lib/helpers.py was
# dead code that could drift unnoticed).  Both trees are packages
# (``tests/__init__.py``, ``tests_lib/__init__.py``) and pytest's prepend
# import mode puts the repo root on sys.path, so test modules import their own
# tier explicitly: ``from tests.helpers import ...`` / ``from
# tests_lib.helpers import ...`` (same convention the fixtures already use).
markers = [
    "gpu: tests that require a CUDA GPU (deselected by default, run with: -m gpu)",
    "slow: CLI subprocess tests that spawn a fresh Python process (~16s each)",
    "core: basic app functionality (audio, medias, votes, inclusion, settings, frontend)",
    "api: API contracts, error handling, dashboard",
    "sorting: text sort, learned sort, diversity, safe thresholds",
    "datasets: dataset loading, splitting, combining, origins, dedup",
    "io: importers, exporters, labels, processors",
    "detectors: detectors, extractors, processors, clippers, eval",
    "downloads: demo dataset download tests (network-dependent)",
    "integration: end-to-end workflows, thread safety",
    "cli: CLI autodetect, load sort window, progress",
    "converters: document and media converters",
    "projection: VTSBrowse UMAP projection and hex-tile pyramid",
    "meta: repo/tooling meta-tests (packaging, Dockerfiles, docs, scripts/, .claude/hooks/, the run-tests.sh gates, the test harness); no vtsearch/vtscore behaviour",
    "frontend: frontend-only gate (Angular build + npm audit + Vitest unit suite); has no Python tests, runs via ./run-tests.sh frontend",
    "slides: slide-deck gate (ruff, codespell, check-docs, deck preflight); has no Python tests, runs via ./run-tests.sh slides",
]
# --timeout: per-test wall-clock cap, so one hung test fails with a traceback
#   naming it instead of stalling the whole run. 300s is ~10x the slowest
#   legitimate test (the umap-learn numba JIT compile, ~30s), so it only ever
#   fires on a genuine hang. `thread` (not the default `signal` method) because
#   tests run under xdist workers and signal-based interruption only works on
#   the main thread, missing hangs blocked in C extensions or socket reads.
#   The outer wall-clock cap in run-tests.sh is the backstop for the case this
#   cannot see: a worker that dies outright can no longer fire its own timeout.
addopts = "-m 'not gpu and not slow' --timeout=300 --timeout-method=thread"

[tool.coverage.run]
source = ["vtsearch", "vtscore"]
branch = true
omit = [
    "vtsearch/_version.txt",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.codespell]
# Skip generated, binary, frontend node_modules (including nested
# node_modules npm installs), serialized formats, and any in-repo
# virtualenv (third-party site-packages must never be spell-checked).
# A study's report.html is a generated experiment report with embedded
# base64 image data URIs, the same class of binary-ish content *.svg is
# already skipped for.  A study's viewer.html (scripts/experiments/
# calibration/viewer.py) is the same class again: a self-contained page
# carrying the run's per-cell numbers as an encoded payload, which
# codespell reads as thousands of misspelled two-letter words.
# slides/_build and slides/_out are gitignored deck-build artifacts; the
# rendered PDFs there decode as mojibake that codespell "corrects", which
# used to fail any test run that happened after `slides/render.sh`.
skip = "*.lock,*.svg,*.json,*.pkl,*.npz,*.min.js,*.min.css,*node_modules*,data,static,model_cache,.git,*.ipynb,package-lock.json,*venv*,.venv,venv,*docs/experiments/*/report.html,*docs/experiments/*/viewer.html,*vtscore/projection/assets*,*slides/_build*,*slides/_out*"
# Domain terms (clap/siglip/xclip = embedder names; wrest/caller/recaller =
# names of the removed integration scaffolds, kept because vtscore/CHANGELOG.md
# records their removal), legitimate code identifiers (numer/denom in
# slope formulas, medias as the global state proxy, goup as a TS method,
# repid as the camelCase TS mirror of the projection's rep_id field),
# and stylistic spellings the project uses consistently (re-use,
# pre-select, unparseable, invokable). usera = the "userA" persona in
# design docs; teh = Yee Whye Teh in references. mane/tread are object
# parts in the VG scale-study exclusion vocabulary (pile_config). bouy and
# busses are VG annotators' own spellings, quoted verbatim: `bouy` is an entry
# in SCALE_VG_AMBIGUOUS and `busses` is the plural the stemmer in
# vg_name_families.py is documented as reaching (#3618); `dalmation` is how VG
# spells the breed and is a member of the `dog`/breed group in SCALE_VG_GROUPS
# (#3636); `vas` is VG's truncated spelling of `vase` and joined
# SCALE_VG_AMBIGUOUS at the #3588 promotion. Correcting any of them would break
# a lookup against the data.
ignore-words-list = "bouy,busses,dalmation,vas,clap,siglip,xclip,wrest,caller,recaller,medias,numer,denom,goup,repid,invokable,unparseable,copys,re-use,re-used,re-uses,re-using,re-declaring,pre-select,pre-selects,pre-selected,fpr,ths,ot,te,lod,usera,teh,provence,mane,tread,shepard,trough,umbrealla,umberella,unbrella,umbella,umbrela,bicyle,hyrdant"
